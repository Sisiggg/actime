<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTime · Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <h1>ACTime <span>· Monitoring Dashboard</span></h1>
    <div class="header-right">
      <nav>
        <a href="/" class="active">Dashboard</a>
        <a href="/reports.html">Reports</a>
      </nav>
      <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <div class="container">
    <div class="summary" id="summary">
      <div class="summary-card accent-blue">
        <div class="summary-top">
          <span class="label">Total Rooms</span>
          <span class="summary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </span>
        </div>
        <div class="value" id="totalRooms">—</div>
      </div>
      <div class="summary-card accent-green">
        <div class="summary-top">
          <span class="label">Currently ON</span>
          <span class="summary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
          </span>
        </div>
        <div class="value" id="totalOn">—</div>
      </div>
      <div class="summary-card accent-orange">
        <div class="summary-top">
          <span class="label">Hours Today</span>
          <span class="summary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </span>
        </div>
        <div class="value" id="totalHours">—</div>
      </div>
      <div class="summary-card accent-blue">
        <div class="summary-top">
          <span class="label">Avg Temperature</span>
          <span class="summary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
          </span>
        </div>
        <div class="value" id="avgTemp">—</div>
      </div>
    </div>

    <div class="section-title">
      <span>Monitored Rooms</span>
      <span id="lastUpdate" class="section-meta"></span>
    </div>
    <div id="roomGrid" class="room-grid">
      <div class="loading"><div class="spinner"></div>Loading rooms...</div>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
