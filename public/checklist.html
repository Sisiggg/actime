<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTime · Monitoring Checklist</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #fff; }
    body.dark-mode { background: #0f0f1a; }
    .checklist-wrap { overflow-x: auto; padding: 8px 0; }
    .checklist-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--text); }
    .checklist-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
    .checklist-table th, .checklist-table td { border: 1px solid #000; padding: 8px 10px; text-align: center; white-space: nowrap; }
    body.dark-mode .checklist-table th,
    body.dark-mode .checklist-table td { border-color: #444; }
    .checklist-table thead th { background: #f8f9fa; font-weight: 700; font-size: 12px; }
    body.dark-mode .checklist-table thead th { background: #1e1e2e; color: #e0e0e0; }
    .checklist-table thead th.col-header { font-size: 12px; text-transform: none; letter-spacing: 0; }
    .checklist-table thead th.date-header { font-size: 12px; }
    .checklist-table td.office { text-align: left; font-weight: 600; }
    .checklist-table td.num { text-align: center; font-weight: 600; color: #888; }
    .checklist-table td.time-val { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
    .checklist-table td.dash { color: #bbb; }
    .checklist-table td.running { color: #34a853; font-style: italic; }
    .checklist-table tbody tr:nth-child(even) { background: #fafafa; }
    body.dark-mode .checklist-table tbody tr:nth-child(even) { background: #141420; }
    .checklist-period { text-align: center; font-size: 13px; color: #888; margin-bottom: 16px; }
    .nav-link-check { color: #1a73e8; margin-left: 16px; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <header class="header">
    <h1>ACTime <span>· Monitoring Checklist</span></h1>
    <div class="header-right">
      <nav>
        <a href="/">Dashboard</a>
        <a href="/reports.html">Reports</a>
        <a href="/checklist.html" class="active">Checklist</a>
      </nav>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="container">
    <div id="checklistContent">
      <div class="loading"><div class="spinner"></div>Loading checklist...</div>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/checklist.js"></script>
</body>
</html>
